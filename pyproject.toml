[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landsat-climate-ml"
version = "0.2.0"
description = "Land cover change, surface heat (LST, UHI, UTFVI), carbon stock and drought from Landsat, with a gallery of published studies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdulla Al Kafy", email = "abdullaalkafy@utexas.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "xarray>=2023.1", "netCDF4>=1.6", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
download = ["pystac-client>=0.7", "planetary-computer>=1.0", "odc-stac>=0.3", "rasterio>=1.3", "shapely>=2.0"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E702", "B905"]
